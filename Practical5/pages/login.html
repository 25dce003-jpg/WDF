<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CHARUSAT | Student Login</title>

    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

    <!-- Header -->
    <header class="header">

        <div class="logo">
            <img src="../images/charusat.png" alt="CHARUSAT Logo">
        </div>

        <div class="page-title">
            <h2>STUDENT LOGIN</h2>
        </div>

        <div class="logout-text">
            <a href="login.html">Logout</a>
        </div>

    </header>


    <!-- Login Section -->
    <main>

        <div class="login-container">

            <div class="login-heading">
                <h1>Welcome Back</h1>
                <p>Login to access your student portal</p>
            </div>


            <!-- IMPORTANT -->
            <form id="loginForm">

                <!-- Student ID -->
                <div class="input-group">

                    <label for="studentID">
                        Student ID
                        <span>*</span>
                    </label>

                    <input
                        type="text"
                        id="studentID"
                        name="studentID"
                        placeholder="Enter your student ID"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="input-group">

                    <label for="studentpass">
                        Password
                        <span>*</span>
                    </label>

                    <input
                        type="password"
                        id="studentpass"
                        name="studentpass"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <!-- Remember / Forgot -->
                <div class="login-options">

                    <label class="remember">

                        <input type="checkbox" name="remember">

                        <span>Remember me</span>

                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <!-- Buttons -->
                <div class="submit-section">

                    <button type="submit" class="login-btn">
                        Login
                    </button>

                    <button type="reset" class="clear-btn">
                        Clear
                    </button>

                </div>

            </form>

        </div>

    </main>


    <!-- Footer -->
    <footer>
        <p>© 2026 CHARUSAT University | Student Portal</p>
    </footer>


    <!-- JavaScript -->
    <script src="../js/login.js"></script>

</body>

</html>
