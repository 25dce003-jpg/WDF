<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hostel/PG Data 2026-27</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="line"></div>

    <div class="header">
        <h1>Hostel/PG Data 2026-27</h1>
    </div>

    <div class="account">
        <div class="email">
            <strong>amrutiyaaniket3504@gmail.com</strong>
            <a href="#">Switch account</a>
        </div>

        <p>Not shared</p>
    </div>

    <hr>

    <p class="required">
        <span>*</span> Indicates required question
    </p>

</div>

<main>

<form action="#" method="post">

   
    <div class="question-box">

        <label for="studentid">
            Student ID <span>*</span>
        </label>

        <input
            type="text"
            id="studentid"
            name="studentid"
            placeholder="Write Student ID"
            required>

    </div>

  
    <div class="question-box">

        <label for="studentname">
            Student Name <span>*</span>
        </label>

        <input
            type="text"
            id="studentname"
            name="studentname"
            placeholder="Write Student Name"
            required>

    </div>

  
    <div class="question-box">

        <label class="question">
            Department <span>*</span>
        </label>

        <div class="option">
            <input type="radio" id="ce" name="department" value="CE" required>
            <label for="ce">B.Tech (CE)</label>
        </div>

        <div class="option">
            <input type="radio" id="cse" name="department" value="CSE">
            <label for="cse">B.Tech (CSE)</label>
        </div>

        <div class="option">
            <input type="radio" id="it" name="department" value="IT">
            <label for="it">B.Tech (IT)</label>
        </div>

    </div>

  
    <div class="question-box">

        <label class="question">
            Current Semester <span>*</span>
        </label>

        <div class="option">
            <input type="radio" id="sem1" name="semester" value="Semester 1" required>
            <label for="sem1">Semester 1</label>
        </div>

        <div class="option">
            <input type="radio" id="sem2" name="semester" value="Semester 2">
            <label for="sem2">Semester 2</label>
        </div>

        <div class="option">
            <input type="radio" id="sem3" name="semester" value="Semester 3">
            <label for="sem3">Semester 3</label>
        </div>

    </div>

    
    <div class="question-box">

        <label class="question">
            Gender <span>*</span>
        </label>

        <div class="option">
            <input type="radio" id="male" name="gender" value="Male" required>
            <label for="male">Male</label>
        </div>

        <div class="option">
            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label>
        </div>

    </div>

    <div class="question-box">

        <label class="question">
            Hostel Warden <span>*</span>
        </label>

        <div class="option">
            <input type="radio" id="sachi" name="cs" value="Sachi Joshi" required>
            <label for="sachi">Sachi Joshi</label>
        </div>

        <div class="option">
            <input type="radio" id="premal" name="cs" value="Dr. Premal Patel">
            <label for="premal">Dr. Premal Patel</label>
        </div>

        <div class="option">
            <input type="radio" id="bhavika" name="cs" value="Bhavika Patel">
            <label for="bhavika">Bhavika Patel</label>
        </div>

    </div>
    <div  class="question-box">
        <label for="question">
            

        </label>
    </div>

   
    <div class="submit-section">
        <button type="submit">Submit</button>
        <button type="reset">Clear form</button>
    </div>

    

</form>

</main>

</body>
</html>
